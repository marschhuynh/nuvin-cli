name: Release Pre-Release

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to release (comma-separated, empty for all)'
        required: false
        type: string
        default: ''

jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: make build

      - name: Run tests
        run: pnpm test

      - name: Create Pre-Release Pull Request
        uses: changesets/action@v1
        with:
          version: pnpm run version:pre
          publish: pnpm run release:pre
          commit: "chore: pre-release packages"
          title: "chore: pre-release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
