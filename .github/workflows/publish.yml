name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        type: choice
        options:
          - rc
          - stable
      rc_tag:
        description: 'RC tag to promote (required for stable mode, e.g., @nuvin/nuvin-cli@1.35.0-rc.0)'
        required: false
        type: string
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changesets:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for changesets
        id: check
        run: |
          if ls .changeset/*.md 1> /dev/null 2>&1; then
            CHANGESETS=$(ls .changeset/*.md | grep -v README.md | wc -l)
            if [ "$CHANGESETS" -gt 0 ]; then
              echo "has_changesets=true" >> $GITHUB_OUTPUT
              echo "✅ Found $CHANGESETS changeset(s)"
            else
              echo "has_changesets=false" >> $GITHUB_OUTPUT
              echo "⏭️  No changesets found (only README.md)"
            fi
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "⏭️  No changeset files found"
          fi

  build:
    needs: [check-changesets]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.check-changesets.outputs.has_changesets == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: make build

      - uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/build
            packages/*/dist
          key: build-${{ github.sha }}

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/build
            packages/*/dist
          key: build-${{ github.sha }}

      - run: pnpm lint

  test-cli:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/build
            packages/*/dist
          key: build-${{ github.sha }}

      - run: pnpm --filter nuvin-cli test

  test-core:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/build
            packages/*/dist
          key: build-${{ github.sha }}

      - run: pnpm --filter nuvin-core test

  publish:
    needs: [check-changesets, lint, test-cli, test-core]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.test-cli.result == 'success' &&
      needs.test-core.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.check-changesets.outputs.has_changesets == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'stable') && 'production' || null }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/*/build
            packages/*/dist
          key: build-${{ github.sha }}

      # Determine mode
      - name: Determine release mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "value=rc" >> $GITHUB_OUTPUT
            echo "📦 Mode: RC (triggered by push)"
          else
            echo "value=${{ inputs.mode }}" >> $GITHUB_OUTPUT
            echo "📦 Mode: ${{ inputs.mode }} (triggered by workflow_dispatch)"
          fi

      # Validate inputs
      - name: Validate stable mode inputs
        if: steps.mode.outputs.value == 'stable'
        run: |
          if [ -z "${{ inputs.rc_tag }}" ]; then
            echo "❌ rc_tag is required for stable mode"
            exit 1
          fi
          echo "✅ rc_tag provided: ${{ inputs.rc_tag }}"

      # RC Mode Steps
      - name: Enter Pre-release Mode
        if: steps.mode.outputs.value == 'rc'
        run: |
          if [ ! -f .changeset/pre.json ]; then
            echo "Entering pre-release mode with tag 'rc'"
            npx changeset pre enter rc
          else
            echo "Already in pre-release mode"
            cat .changeset/pre.json
          fi

      - name: Version and Publish RC
        if: steps.mode.outputs.value == 'rc'
        id: changesets_rc
        uses: changesets/action@v1
        with:
          version: pnpm run version:pre
          publish: pnpm run release:pre
          commit: "chore: pre-release packages"
          title: "chore: pre-release packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Push RC Tags
        if: steps.mode.outputs.value == 'rc' && steps.changesets_rc.outputs.published == 'true'
        run: |
          git push --tags || echo "⚠️  No new tags to push or push failed"
          echo "✅ RC tags pushed to remote"

      # Stable Mode Steps
      - name: Parse RC version
        if: steps.mode.outputs.value == 'stable'
        id: parse
        run: |
          TAG="${{ inputs.rc_tag }}"
          if [[ "$TAG" =~ @nuvin/nuvin-cli@(.+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="$TAG"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Extracted version: $VERSION"

          STABLE_VERSION=$(echo "$VERSION" | sed 's/-rc\.[0-9]*$//')
          echo "stable_version=$STABLE_VERSION" >> $GITHUB_OUTPUT
          echo "🎯 Target stable version: $STABLE_VERSION"

      - name: Verify RC exists on npm
        if: steps.mode.outputs.value == 'stable'
        run: |
          PRERELEASE_VERSION="${{ steps.parse.outputs.version }}"
          STABLE_VERSION="${{ steps.parse.outputs.stable_version }}"

          CURRENT=$(npm view @nuvin/nuvin-cli version 2>/dev/null || echo "")
          if [ -n "$CURRENT" ] && [ "$CURRENT" = "$STABLE_VERSION" ]; then
            echo "❌ Stable version $STABLE_VERSION is already published to npm"
            exit 1
          fi

          if ! npm view @nuvin/nuvin-cli@"$PRERELEASE_VERSION" version &>/dev/null; then
            echo "❌ Prerelease version $PRERELEASE_VERSION not found on npm"
            echo "Available versions:"
            npm view @nuvin/nuvin-cli versions --json
            exit 1
          fi
          echo "✅ Prerelease version $PRERELEASE_VERSION exists, stable version $STABLE_VERSION not published yet"

      - name: Exit Pre-release Mode and Version
        if: steps.mode.outputs.value == 'stable'
        run: pnpm run version:promote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Changelog
        if: steps.mode.outputs.value == 'stable'
        run: |
          echo "Attempting to generate changelog..."
          if pnpm run changelog ${{ steps.parse.outputs.version }}; then
            echo "✅ Changelog generated successfully"
          else
            echo "⚠️ Changelog generation failed (expected during promotion)"
            echo "Creating promotion changelog entry..."

            VERSION="${{ steps.parse.outputs.version }}"
            STABLE_VERSION="${{ steps.parse.outputs.stable_version }}"

            cat > CHANGELOG.md << EOF
          # Changelog

          ## ${STABLE_VERSION}

          Promoted ${VERSION} to stable release.

          EOF
            echo "✅ Created promotion changelog"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild with stable version
        if: steps.mode.outputs.value == 'stable'
        run: make build

      - name: Publish Stable to npm
        if: steps.mode.outputs.value == 'stable'
        id: publish_stable
        run: pnpm run release:stable
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Commit stable version changes
        if: steps.mode.outputs.value == 'stable' && steps.publish_stable.outcome == 'success'
        run: |
          git add .
          git commit -m "chore: promote ${{ steps.parse.outputs.version }} to stable (${{ steps.parse.outputs.stable_version }})" || echo "No changes to commit"
          git push origin main

      - name: Push Stable Tags
        if: steps.mode.outputs.value == 'stable' && steps.publish_stable.outcome == 'success'
        run: |
          git push --tags || echo "⚠️  No new tags to push or push failed"
          echo "✅ Stable tags pushed to remote"

      # Summary
      - name: RC Release Summary
        if: steps.mode.outputs.value == 'rc' && steps.changesets_rc.outputs.published == 'true'
        run: |
          echo "## ✅ RC Release Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Packages:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.changesets_rc.outputs.publishedPackages }}' | jq -r '.[] | "- \(.name)@\(.version)"' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Stable Release Summary
        if: steps.mode.outputs.value == 'stable' && success()
        run: |
          echo "## ✅ Stable Release Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.parse.outputs.stable_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** @nuvin/nuvin-cli@${{ steps.parse.outputs.stable_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install @nuvin/nuvin-cli@latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Failure Summary
        if: failure()
        run: |
          echo "## ❌ Publish Failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ steps.mode.outputs.value }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check logs above for details." >> $GITHUB_STEP_SUMMARY
          exit 1
