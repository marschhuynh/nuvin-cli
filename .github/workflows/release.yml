name: Release Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: make build

      - name: Run tests
        run: pnpm test

      - name: Enter Pre-release Mode
        run: |
          # Check if already in pre-release mode
          if [ ! -f .changeset/pre.json ]; then
            echo "Entering pre-release mode with tag 'rc'"
            npx changeset pre enter rc
          else
            echo "Already in pre-release mode"
            cat .changeset/pre.json
          fi

      - name: Create RC Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version:pre
          publish: pnpm run release:pre
          commit: "chore: pre-release packages"
          title: "chore: pre-release packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Push Git Tags
        if: steps.changesets.outputs.published == 'true'
        run: |
          # Changesets already created the tags, we just need to push them
          git push --tags || echo "⚠️  No new tags to push or push failed"
          
          echo "✅ Tags pushed to remote"
