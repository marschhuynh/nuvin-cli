name: RC Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changesets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changesets
        id: check
        run: |
          if ls .changeset/*.md 1> /dev/null 2>&1; then
            # Filter out README.md
            CHANGESETS=$(ls .changeset/*.md | grep -v README.md | wc -l)
            if [ "$CHANGESETS" -gt 0 ]; then
              echo "has_changesets=true" >> $GITHUB_OUTPUT
              echo "✅ Found $CHANGESETS changeset(s)"
            else
              echo "has_changesets=false" >> $GITHUB_OUTPUT
              echo "⏭️  No changesets found (only README.md)"
            fi
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "⏭️  No changeset files found"
          fi

  publish-rc:
    needs: check-changesets
    if: needs.check-changesets.outputs.has_changesets == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      mode: rc
    secrets: inherit
