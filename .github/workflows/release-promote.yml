name: Promote Pre-Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'RC tag to promote (e.g., @nuvin/nuvin-cli@1.35.0-rc.0)'
        required: true
        type: string

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.parse.outputs.version }}
      stable_version: ${{ steps.parse.outputs.stable_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version from tag
        id: parse
        run: |
          TAG="${{ github.event.inputs.rc_tag }}"
          # Extract version from tag (e.g., @nuvin/nuvin-cli@1.35.0-rc.0 -> 1.35.0-rc.0)
          if [[ "$TAG" =~ @nuvin/nuvin-cli@(.+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="$TAG"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Extracted version: $VERSION"

          # Extract stable version (e.g., 1.35.0-rc.0 -> 1.35.0)
          STABLE_VERSION=$(echo "$VERSION" | sed 's/-rc\.[0-9]*$//')
          echo "stable_version=$STABLE_VERSION" >> $GITHUB_OUTPUT
          echo "🎯 Target stable version: $STABLE_VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            echo "Installing GitHub CLI..."
            type -p curl >/dev/null || (sudo apt-get update && sudo apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/script/install.sh | sudo bash
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Confirm Selected Version
        run: |
          echo "🎯 Promoting tag: ${{ github.event.inputs.rc_tag }}"
          echo "📌 RC version: ${{ steps.parse.outputs.version }}"
          echo "🚀 Stable version: ${{ steps.parse.outputs.stable_version }}"

      - name: Check for existing npm release
        run: |
          PRERELEASE_VERSION="${{ steps.parse.outputs.version }}"
          STABLE_VERSION="${{ steps.parse.outputs.stable_version }}"

          # Check if stable version already exists
          CURRENT=$(npm view @nuvin/nuvin-cli version 2>/dev/null || echo "")
          if [ -n "$CURRENT" ] && [ "$CURRENT" = "$STABLE_VERSION" ]; then
            echo "❌ Stable version $STABLE_VERSION is already published to npm"
            exit 1
          fi

          # Verify prerelease version exists
          if ! npm view @nuvin/nuvin-cli@"$PRERELEASE_VERSION" version &>/dev/null; then
            echo "❌ Prerelease version $PRERELEASE_VERSION not found on npm"
            echo "Available versions:"
            npm view @nuvin/nuvin-cli versions --json
            exit 1
          fi
          echo "✅ Prerelease version $PRERELEASE_VERSION exists, stable version $STABLE_VERSION not published yet"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version Packages
        run: pnpm run version:promote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Changelog
        run: |
          echo "Attempting to generate changelog..."
          if pnpm run changelog ${{ steps.parse.outputs.version }}; then
            echo "✅ Changelog generated successfully"
          else
            echo "⚠️ Changelog generation failed (expected during promotion)"
            echo "Creating promotion changelog entry..."
            
            VERSION="${{ steps.parse.outputs.version }}"
            STABLE_VERSION="${{ steps.parse.outputs.stable_version }}"
            
            cat > CHANGELOG.md << EOF
          # Changelog

          ## ${STABLE_VERSION}

          Promoted ${VERSION} to stable release.

          EOF
            echo "✅ Created promotion changelog"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify changelog was updated
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ CHANGELOG.md not found"
            exit 1
          fi
          
          echo "✅ Changelog exists"
          echo "Preview:"
          cat CHANGELOG.md | head -30

      - name: Upload artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            packages/*/package.json
            packages/*/CHANGELOG.md
            CHANGELOG.md
            .changeset/pre.json
          retention-days: 7

      - name: Summary
        run: |
          echo "## 🎯 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pre-release tag:** ${{ github.event.inputs.rc_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pre-release version:** ${{ steps.parse.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Stable version:** ${{ steps.parse.outputs.stable_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Changelog Preview" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat CHANGELOG.md | head -20 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Ready for approval.** Review the artifacts and approve the 'Publish Stable Release' job to proceed." >> $GITHUB_STEP_SUMMARY

  publish-stable:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            echo "Installing GitHub CLI..."
            type -p curl >/dev/null || (sudo apt-get update && sudo apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/script/install.sh | sudo bash
          fi

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: make build

      - name: Run tests
        run: pnpm test

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Exit Pre-release Mode and Version
        run: pnpm run version:promote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild with new version
        run: make build

      - name: Commit version changes
        run: |
          git add .
          git commit -m "chore: promote ${{ needs.prepare-release.outputs.version }} to stable (${{ needs.prepare-release.outputs.stable_version }})" || echo "No changes to commit"
          git push origin main

      - name: Publish to npm (Stable)
        id: publish
        run: pnpm run release:stable
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Push Git Tags
        if: success()
        run: |
          git push --tags || echo "⚠️  No new tags to push or push failed"
          echo "✅ Tags pushed to remote"

      - name: Notify Success
        if: success()
        run: |
          echo "## ✅ Stable Release Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.prepare-release.outputs.stable_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** @nuvin/nuvin-cli@${{ needs.prepare-release.outputs.stable_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install @nuvin/nuvin-cli@latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify Failure
        if: failure()
        run: |
          echo "## ❌ Stable Release Failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Action Required:** If publish succeeded but later steps failed:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm deprecate @nuvin/nuvin-cli@VERSION 'Release failed validation'" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          exit 1
