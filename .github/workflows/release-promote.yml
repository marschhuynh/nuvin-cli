name: Promote Pre-Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'RC tag to promote (e.g., @nuvin/nuvin-cli@1.35.0-rc.0)'
        required: true
        type: string

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version from tag
        id: parse
        run: |
          TAG="${{ github.event.inputs.rc_tag }}"
          # Extract version from tag (e.g., @nuvin/nuvin-cli@1.35.0-rc.0 -> 1.35.0-rc.0)
          if [[ "$TAG" =~ @nuvin/nuvin-cli@(.+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="$TAG"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Extracted version: $VERSION"
          
          # Extract stable version (e.g., 1.35.0-rc.0 -> 1.35.0)
          STABLE_VERSION=$(echo "$VERSION" | sed 's/-rc\.[0-9]*$//')
          echo "stable_version=$STABLE_VERSION" >> $GITHUB_OUTPUT
          echo "🎯 Target stable version: $STABLE_VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            echo "Installing GitHub CLI..."
            type -p curl >/dev/null || (sudo apt-get update && sudo apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/script/install.sh | sudo bash
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Confirm Selected Version
        run: |
          echo "🎯 Promoting tag: ${{ github.event.inputs.rc_tag }}"
          echo "📌 RC version: ${{ steps.parse.outputs.version }}"
          echo "🚀 Stable version: ${{ steps.parse.outputs.stable_version }}"

      - name: Check for existing Release PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_COUNT=$(gh pr list --base main --head "release/promote-${{ steps.parse.outputs.version }}" --json number -q '. | length')
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "❌ Release PR already exists for ${{ steps.parse.outputs.version }}"
            gh pr list --base main --head "release/promote-${{ steps.parse.outputs.version }}" --json title,number,url -q '.'
            exit 1
          fi
          echo "No existing PR found, proceeding..."

      - name: Check for existing npm release
        run: |
          PRERELEASE_VERSION="${{ steps.parse.outputs.version }}"
          STABLE_VERSION="${{ steps.parse.outputs.stable_version }}"
          
          # Check if stable version already exists
          CURRENT=$(npm view @nuvin/nuvin-cli version 2>/dev/null || echo "")
          if [ -n "$CURRENT" ] && [ "$CURRENT" = "$STABLE_VERSION" ]; then
            echo "❌ Stable version $STABLE_VERSION is already published to npm"
            exit 1
          fi
          
          # Verify prerelease version exists
          if ! npm view @nuvin/nuvin-cli@"$PRERELEASE_VERSION" version &>/dev/null; then
            echo "❌ Prerelease version $PRERELEASE_VERSION not found on npm"
            echo "Available versions:"
            npm view @nuvin/nuvin-cli versions --json
            exit 1
          fi
          echo "✅ Prerelease version $PRERELEASE_VERSION exists, stable version $STABLE_VERSION not published yet"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version Packages
        run: pnpm run version:promote

      - name: Generate Changelog
        run: pnpm run changelog ${{ steps.parse.outputs.version }}

      - name: Verify changelog was updated
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          if [ ! -f CHANGELOG.md ]; then
            echo "⚠️ CHANGELOG.md not created - no unreleased changesets found"
            echo "This is expected for promotion (changesets consumed during RC release)"
            echo "Creating minimal CHANGELOG.md for this release..."
            cat > CHANGELOG.md << EOF
          # Changelog

          ## $VERSION

          Promoted from RC to stable release.

          EOF
          elif ! grep -q "^## $VERSION" CHANGELOG.md; then
            echo "❌ Changelog generation failed"
            exit 1
          fi
          echo "✅ Changelog ready"

      - name: Create Release PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: promote ${{ steps.parse.outputs.version }} to stable"
          branch: release/promote-${{ steps.parse.outputs.version }}
          title: "chore: promote ${{ steps.parse.outputs.version }} to stable"
          body: |
            ## Release Promotion

            **Pre-release tag:** ${{ github.event.inputs.rc_tag }}
            **Pre-release version:** ${{ steps.parse.outputs.version }}
            **Stable version:** ${{ steps.parse.outputs.stable_version }}

            ### Changelog

            <!-- Auto-generated from changesets -->

            ---
            **After merging this PR, the stable version will be published to npm.**

            Please review:
            - [ ] Changelog is correct
            - [ ] Version bumps are accurate
            - [ ] No unintended changes
          labels: release
          reviewers: |
            ${{ github.actor }}
          draft: false
