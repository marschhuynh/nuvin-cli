name: Promote Pre-Release to Stable

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'RC tag to promote (e.g., @nuvin/nuvin-cli@1.35.0-rc.0)'
        required: true
        type: string

jobs:
  promote-to-stable:
    uses: ./.github/workflows/publish.yml
    with:
      mode: stable
      rc_tag: ${{ inputs.rc_tag }}
    secrets: inherit
